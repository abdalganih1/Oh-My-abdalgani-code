name = "abdalgani-gateway"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Live on https://abdalgani-gateway.abdalganih1.workers.dev
# To take over api.abdalgani.com (currently the old LiteLLM server — switching cuts it off):
#   1. remove the existing DNS record for `api` in the abdalgani.com zone
#   2. uncomment the line below and run `npm run deploy`
# routes = [{ pattern = "api.abdalgani.com", custom_domain = true }]
workers_dev = true

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/api/*", "/chat/*", "/messages", "/responses", "/models", "/health"]

[[d1_databases]]
binding = "DB"
database_name = "abdalgani-gateway"
database_id = "217025e3-9e35-491c-81e9-4e4354567ca8"
migrations_dir = "migrations"

# Rate limits enforced at Cloudflare's edge (counters are per location, approximate by design).
# Per network/IP: covers key guessing and floods. Per key: one student can't hammer the gateway.
[[ratelimits]]
name = "RL_IP"
namespace_id = "41001"
simple = { limit = 240, period = 60 }

[[ratelimits]]
name = "RL_USER"
namespace_id = "41002"
simple = { limit = 90, period = 60 }

# Every 30 min: discover new provider models, archive dead ones (≥6h failing), expire "new" after 7 days.
[triggers]
crons = ["*/30 * * * *"]

[observability]
enabled = true

# Secrets (never commit):
#   npx wrangler secret put ADMIN_TOKEN       # admin panel login
#   npx wrangler secret put ENCRYPTION_KEY    # encrypts provider keys stored in D1
#   npx wrangler secret put NOTIFY_WEBHOOK    # optional: Discord/Slack webhook or Telegram sendMessage?chat_id=… URL
